name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .dockerignore
      - .trivyignore
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - .dockerignore
      - .trivyignore
      - .github/workflows/build.yml

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # renovate: datasource=docker depName=caddy
  CADDY_VERSION: 2.11.3
  # renovate: datasource=github-releases depName=caddy-dns/cloudflare
  CLOUDFLARE_DNS_VERSION: v0.2.4
  # renovate: datasource=github-releases depName=pberkel/caddy-storage-redis
  REDIS_STORAGE_VERSION: v1.8.0
  # renovate: datasource=go depName=go.opentelemetry.io/otel
  OTEL_VERSION: v1.43.0
  IMAGE_NAME: caddy-cloudflare-redis
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/caddy-cloudflare-redis
  DOCKERHUB_IMAGE: docker.io/iuliandita/caddy-cloudflare-redis
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build-test:
    name: build and scan local image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build local test image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: local/${{ env.IMAGE_NAME }}:test
          build-args: |
            CADDY_VERSION=${{ env.CADDY_VERSION }}
            CLOUDFLARE_DNS_VERSION=${{ env.CLOUDFLARE_DNS_VERSION }}
            REDIS_STORAGE_VERSION=${{ env.REDIS_STORAGE_VERSION }}
            OTEL_VERSION=${{ env.OTEL_VERSION }}

      - name: Verify Caddy modules
        run: |
          set -euo pipefail
          docker run --rm "local/${IMAGE_NAME}:test" caddy list-modules | tee /tmp/modules.txt
          grep -qx 'dns.providers.cloudflare' /tmp/modules.txt
          grep -qx 'caddy.storage.redis' /tmp/modules.txt

      - name: Run Trivy vulnerability scanner
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=aquasec/trivy
          TRIVY_VERSION=0.70.0
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/.trivyignore:/work/.trivyignore:ro" \
            -w /work \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile /work/.trivyignore \
            --exit-code 1 \
            --format table \
            "local/${IMAGE_NAME}:test"

  dockerhub-enabled:
    name: check Docker Hub publishing
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.dockerhub.outputs.enabled }}
    steps:
      - name: Check Docker Hub secrets
        id: dockerhub
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub secrets missing; skipping Docker Hub publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  publish-ghcr-platform:
    name: publish GHCR image (${{ matrix.arch }})
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate architecture-specific tags
        id: caddy-tags
        run: |
          set -euo pipefail
          major="${CADDY_VERSION%%.*}"
          minor="${CADDY_VERSION%.*}"
          {
            echo "tags<<EOF"
            for tag in latest alpine "$major" "$minor" "$CADDY_VERSION" "$major-alpine" "$minor-alpine" "$CADDY_VERSION-alpine"; do
              echo "${GHCR_IMAGE}:${tag}-${{ matrix.arch }}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push GHCR image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.caddy-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Caddy with Cloudflare DNS and Redis storage modules
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            CADDY_VERSION=${{ env.CADDY_VERSION }}
            CLOUDFLARE_DNS_VERSION=${{ env.CLOUDFLARE_DNS_VERSION }}
            REDIS_STORAGE_VERSION=${{ env.REDIS_STORAGE_VERSION }}
            OTEL_VERSION=${{ env.OTEL_VERSION }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,scope=ghcr-${{ matrix.arch }},mode=max

  publish-ghcr-manifest:
    name: publish GHCR manifests
    needs: publish-ghcr-platform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch GHCR manifests
        run: |
          set -euo pipefail
          major="${CADDY_VERSION%%.*}"
          minor="${CADDY_VERSION%.*}"
          for tag in latest alpine "$major" "$minor" "$CADDY_VERSION" "$major-alpine" "$minor-alpine" "$CADDY_VERSION-alpine"; do
            docker buildx imagetools create \
              -t "${GHCR_IMAGE}:${tag}" \
              "${GHCR_IMAGE}:${tag}-amd64" \
              "${GHCR_IMAGE}:${tag}-arm64"
          done

  publish-dockerhub-platform:
    name: publish Docker Hub image (${{ matrix.arch }})
    needs: [build-test, dockerhub-enabled]
    if: github.event_name != 'pull_request' && needs.dockerhub-enabled.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Generate architecture-specific tags
        id: caddy-tags
        run: |
          set -euo pipefail
          major="${CADDY_VERSION%%.*}"
          minor="${CADDY_VERSION%.*}"
          {
            echo "tags<<EOF"
            for tag in latest alpine "$major" "$minor" "$CADDY_VERSION" "$major-alpine" "$minor-alpine" "$CADDY_VERSION-alpine"; do
              echo "${DOCKERHUB_IMAGE}:${tag}-${{ matrix.arch }}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker Hub image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.caddy-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Caddy with Cloudflare DNS and Redis storage modules
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            CADDY_VERSION=${{ env.CADDY_VERSION }}
            CLOUDFLARE_DNS_VERSION=${{ env.CLOUDFLARE_DNS_VERSION }}
            REDIS_STORAGE_VERSION=${{ env.REDIS_STORAGE_VERSION }}
            OTEL_VERSION=${{ env.OTEL_VERSION }}
          cache-from: type=gha,scope=dockerhub-${{ matrix.arch }}
          cache-to: type=gha,scope=dockerhub-${{ matrix.arch }},mode=max

  publish-dockerhub-manifest:
    name: publish Docker Hub manifests
    needs: [publish-dockerhub-platform, dockerhub-enabled]
    if: github.event_name != 'pull_request' && needs.dockerhub-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Create multi-arch Docker Hub manifests
        run: |
          set -euo pipefail
          major="${CADDY_VERSION%%.*}"
          minor="${CADDY_VERSION%.*}"
          for tag in latest alpine "$major" "$minor" "$CADDY_VERSION" "$major-alpine" "$minor-alpine" "$CADDY_VERSION-alpine"; do
            docker buildx imagetools create \
              -t "${DOCKERHUB_IMAGE}:${tag}" \
              "${DOCKERHUB_IMAGE}:${tag}-amd64" \
              "${DOCKERHUB_IMAGE}:${tag}-arm64"
          done
